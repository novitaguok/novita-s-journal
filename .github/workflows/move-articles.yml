name: Move Hashnode Articles

on:
  push:
    branches:
      - main

jobs:
  move-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move published articles to content/articles
        run: |
          # Enable nullglob to avoid literal *.md when no files match
          shopt -s nullglob
          
          # Find all .md files in the root directory
          files=()
          for f in *.md; do
            if [[ "$f" != "README.md" && "$f" != draft-* ]]; then
              files+=("$f")
            fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "No published articles found in the root directory to move."
            exit 0
          fi

          echo "Found articles to move: ${files[*]}"
          mkdir -p content/articles

          for f in "${files[@]}"; do
            echo "Moving $f to content/articles/$f"
            mv "$f" "content/articles/$f"
          done

          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage, commit and push
          git add .
          git commit -m "chore: move published articles from root to content/articles"
          git push
